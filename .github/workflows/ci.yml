name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # 로컬과 같은 주 버전
      postgres:
        image: postgres:18
        env:
          # 이 job이 끝나면 버려지는 DB라 비밀번호 없이 띄운다(저장소에 비밀번호 글자를 두지 않으려고).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 화면(apps/web)이 빌드되는지. 단위 테스트는 아래 npm test가 함께 돈다.
      - run: npm run build -w @event-analytics/web
      # 소유자 주소는 마이그레이션·파티션 만들기와 테스트 준비만 읽는다(DESIGN 10장 12). 서버와 앱 코드는 앱 role(DML만)이다.
      - name: 소유자 주소를 쓰는 곳이 정해진 파일뿐인지
        # grep은 찾으면 0, 못 찾으면 1, 오류(경로가 없음 등)면 2다. 목록으로 견주어 검사가 조용히 꺼지지 않게 한다.
        run: |
          src() { grep -rIl --include='*.ts' --include='*.tsx' --include='*.mts' --include='*.cts' \
            --include='*.js' --include='*.mjs' --include='*.cjs' --include='package.json' \
            --exclude-dir=node_modules --exclude-dir=dist "$1" apps packages | sort; }
          found="$(src DATABASE_OWNER_URL)"
          expected="$(printf '%s\n' \
            apps/api/src/db/e2e-prepare-cli.ts \
            apps/api/src/db/maintain-cli.ts \
            apps/api/src/db/migrate-cli.ts \
            apps/api/src/e2e-serve-cli.ts \
            apps/api/src/load/detach-rehearsal-cli.ts \
            apps/api/src/load/generate-cli.ts \
            apps/api/src/load/run-cli.ts \
            apps/api/src/load/template-cli.ts \
            apps/api/test/global-setup.ts \
            apps/web/playwright.config.ts)"
          test "$found" = "$expected" || { echo "$found"; exit 1; }
          # 테스트는 앱 role로 돈다. 소유자 주소를 받는 테스트도 정해 둔다.
          found="$(src ownerDatabaseUrl)"
          expected="$(printf '%s\n' \
            apps/api/src/db/databases.test.ts \
            apps/api/src/db/events.test.ts \
            apps/api/src/db/migrate.test.ts \
            apps/api/src/db/roles.test.ts \
            apps/api/src/load/template.test.ts \
            apps/api/src/routes/ingest.test.ts \
            apps/api/test/fresh-database.ts \
            apps/api/test/global-setup.ts)"
          test "$found" = "$expected" || { echo "$found"; exit 1; }
      # 로컬과 같게 슈퍼유저가 아닌 role 둘(소유자, 앱)과, 정렬을 OS에 맡기지 않는 DB를 만든다(README 로컬 준비, DESIGN 10장 13).
      # 비밀번호는 실행마다 새로 만들어, 저장소에 비밀번호 글자가 남지 않게 한다.
      - name: role과 DB 만들기(README의 로컬 준비와 같음)
        run: |
          OWNER_PASSWORD="$(openssl rand -hex 16)"
          APP_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$OWNER_PASSWORD"
          echo "::add-mask::$APP_PASSWORD"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE event_analytics LOGIN CREATEDB PASSWORD '$OWNER_PASSWORD'" \
            -c "CREATE DATABASE event_analytics OWNER event_analytics TEMPLATE template0 ENCODING 'UTF8' LC_COLLATE 'C' LC_CTYPE 'C' LOCALE_PROVIDER builtin BUILTIN_LOCALE 'C.UTF-8'" \
            -c "CREATE ROLE event_analytics_app LOGIN PASSWORD '$APP_PASSWORD'" \
            -c "GRANT event_analytics_app TO event_analytics"
          echo "DATABASE_URL=postgres://event_analytics_app:$APP_PASSWORD@localhost:5432/event_analytics" >> "$GITHUB_ENV"
          echo "DATABASE_OWNER_URL=postgres://event_analytics:$OWNER_PASSWORD@localhost:5432/event_analytics" >> "$GITHUB_ENV"
      - run: npm run db:migrate -w @event-analytics/api
      - run: npm test

  # 화면에서 설정한 수가 고정 데이터와 같은지(DESIGN 6.7 E2E, 10장 55). DB event_analytics_e2e는 준비(e2e:prepare)가 소유자로 지우고 만든다.
  e2e:
    runs-on: ubuntu-latest
    # 보통 1분이지만, 브라우저가 쓰는 시스템 라이브러리(apt)를 받는 데 미러가 느리면 10분 넘게 걸린 적이 있다(40kB/s)
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      # test 작업과 같은 role 둘. DB는 준비가 만들므로(소유자에게 CREATEDB) 여기서는 만들지 않는다.
      # 주소의 DB 이름은 playwright.config.ts가 event_analytics_e2e로 바꾼다.
      - name: role 만들기
        run: |
          OWNER_PASSWORD="$(openssl rand -hex 16)"
          APP_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$OWNER_PASSWORD"
          echo "::add-mask::$APP_PASSWORD"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE event_analytics LOGIN CREATEDB PASSWORD '$OWNER_PASSWORD'" \
            -c "CREATE ROLE event_analytics_app LOGIN PASSWORD '$APP_PASSWORD'" \
            -c "GRANT event_analytics_app TO event_analytics"
          echo "DATABASE_URL=postgres://event_analytics_app:$APP_PASSWORD@localhost:5432/event_analytics" >> "$GITHUB_ENV"
          echo "DATABASE_OWNER_URL=postgres://event_analytics:$OWNER_PASSWORD@localhost:5432/event_analytics" >> "$GITHUB_ENV"
      - run: npm run test:e2e -w @event-analytics/web
      - name: 실패하면 trace를 남긴다
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/web/test-results/
          retention-days: 7
